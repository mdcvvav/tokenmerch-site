name: Remove files from repo

# Mockup renders go stale whenever a product is swapped, and the old ones are a trap:
# they look like current assets. Deleting a batch through the web UI is one commit per
# file, so this does the whole list in one run.

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'JSON array of repo paths: ["models/old.webp", ...]'
        required: true

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete
        env:
          PATHS: ${{ github.event.inputs.paths }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          paths = json.loads(os.environ["PATHS"])
          if not isinstance(paths, list):
              raise SystemExit("paths must be a JSON array")
          for p in paths:
              p = str(p)
              # stay inside the repo: no absolute paths, no parent traversal
              if p.startswith("/") or ".." in p.split("/") or p.startswith(".git"):
                  raise SystemExit("refusing path: " + p)
              if os.path.isfile(p):
                  os.remove(p)
                  print("removed", p)
              else:
                  print("not found, skipping", p)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Remove files: ${{ github.event.inputs.paths }}"
            git push
          fi
